<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧪 움직이는 스티커 시험 (사파리)</title>
<!-- 🧪 도련 11-18 : 그림판 css 블록 · svg 블록을 "움직이는 svg 스티커"로 저장할 수 있는지 아이패드에서 보는 시험 페이지
     스티커는 다이어리처럼 <img src="data:image/svg+xml..."> 로 붙여요 (캡슐 스티커와 같은 방식) -->
<style>
body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #fff4f8; color: #4a3442; }
h1 { font-size: 20px; margin: 16px; }
p.top { margin: 0 16px 12px; font-size: 14px; line-height: 1.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 0 16px 24px; }
.card { background: #fff; border: 2px solid #f1d3dd; border-radius: 16px; padding: 10px; }
.card b { display: block; font-size: 15px; margin-bottom: 4px; }
.card small { display: block; font-size: 12.5px; color: #8a6a76; line-height: 1.45; min-height: 36px; }
.stage { height: 170px; display: grid; place-items: center; background: repeating-conic-gradient(#f6eef2 0 25%, #fff 0 50%) 0 0 / 20px 20px; border-radius: 10px; margin-top: 6px; }
.stage img, .stage canvas { width: 150px; height: 150px; }
.foot { font-size: 11px; color: #a08; padding: 0 16px 24px; word-break: break-all; }
</style>
</head>
<body>
<h1>🧪 움직이는 스티커 시험</h1>
<p class="top"><b>🔥 새 방식</b> : css 상자는 그림으로 구워서 svg 안에 넣고, 움직임은 svg 쪽에서 줘요.<br>스티커는 모두 다이어리와 같은 방식(그림으로 붙이기)이에요.<br>번호마다 <b>설명대로 보이는지</b> 보고 알려 주세요. 예) "1~4 잘 보여, 5 안 움직여"</p>
<div class="grid" id="g"></div>
<p class="foot" id="ua"></p>
<script>
const NS = 'http://www.w3.org/2000/svg', XH = 'http://www.w3.org/1999/xhtml';
const url = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const fo = (css, body, defs = '') => `<svg xmlns="${NS}" width="200" height="200" viewBox="0 0 200 200">${defs}<foreignObject x="0" y="0" width="200" height="200"><div xmlns="${XH}" style="position:relative;width:200px;height:200px;margin:0;padding:0;"><style>${css}</style>${body}</div></foreignObject></svg>`;
const T = [
  ['1', '기준 : 순수 svg + css 움직임', '캡슐 스티커 방식 · 분홍 하트가 두근두근 커졌다 작아져야 해요',
    `<svg xmlns="${NS}" width="200" height="200" viewBox="0 0 200 200"><style>.h{transform-box:fill-box;transform-origin:center;animation:b 1s ease-in-out infinite}@keyframes b{50%{transform:scale(1.2)}}</style><path class="h" fill="#ff6f91" d="M100 165C30 115 30 55 70 50c15-2 25 8 30 20 5-12 15-22 30-20 40 5 40 65-30 115z"/></svg>`],
  ['2', 'css 상자 (가만히)', '둥근 네모 · 분홍→하늘 그라데이션 · 그림자 · 가운데 "말랑" 글자',
    fo(`.b{position:absolute;left:25px;top:25px;width:150px;height:150px;border-radius:32px;background:linear-gradient(135deg,#ff9ab8,#8fd3ff);box-shadow:0 8px 16px rgba(90,50,60,.35);display:grid;place-items:center;font:900 30px sans-serif;color:#fff}`, `<div class="b">말랑</div>`)],
  ['3', 'css 상자 + 움직임', '노란 별 상자가 빙글빙글 돌고 · 위아래로 통통 튀어야 해요',
    fo(`.w{position:absolute;left:40px;top:40px;width:120px;height:120px;animation:j 1.2s ease-in-out infinite}.b{width:100%;height:100%;background:#ffd23f;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:r 3s linear infinite}@keyframes r{to{transform:rotate(360deg)}}@keyframes j{50%{transform:translateY(-18px)}}`, `<div class="w"><div class="b"></div></div>`)],
  ['4', 'css 장식 1 · 2 (::before · ::after)', '하늘 동그라미 + 왼쪽 위 작은 분홍 동그라미 + 오른쪽 아래 초록 동그라미 (초록이 깜빡)',
    fo(`.b{position:absolute;left:40px;top:40px;width:120px;height:120px;border-radius:50%;background:#8fd3ff}.b::before{content:'';position:absolute;left:-20px;top:-20px;width:50px;height:50px;border-radius:50%;background:#ff9ab8}.b::after{content:'';position:absolute;right:-15px;bottom:-15px;width:45px;height:45px;border-radius:50%;background:#5cc98a;animation:f 1s steps(2) infinite}@keyframes f{50%{opacity:0}}`, `<div class="b"></div>`)],
  ['5', '어려운 css 모음', '무지개 원(conic) · 가운데 구멍(mask) · 살짝 흐린 테두리 · 겹친 곳 색 섞임',
    fo(`.a{position:absolute;left:25px;top:25px;width:150px;height:150px;border-radius:50%;background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red);-webkit-mask:radial-gradient(circle,transparent 30px,#000 31px);mask:radial-gradient(circle,transparent 30px,#000 31px);filter:blur(1px)}.c{position:absolute;left:110px;top:110px;width:70px;height:70px;background:#4aa8ff;mix-blend-mode:multiply;border-radius:12px}`, `<div class="a"></div><div class="c"></div>`)],
  ['6', 'css 상자에 svg 필터 (css→svg)', '분홍 네모 가장자리가 물결처럼 울퉁불퉁해야 해요',
    fo(`.b{position:absolute;left:35px;top:35px;width:130px;height:130px;background:#ff6f91;border-radius:20px;filter:url(#wv)}`, `<div class="b"></div>`, `<defs><filter id="wv"><feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter></defs>`)],
  ['7', 'svg 그림에 css 효과 (svg→css)', '보라 별에 그림자 + 좌우로 3D 뒤집히듯 납작해졌다 돌아와야 해요',
    `<svg xmlns="${NS}" width="200" height="200" viewBox="0 0 200 200"><style>.s{transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 6px 4px rgba(60,30,80,.4));animation:f 2s ease-in-out infinite}@keyframes f{50%{transform:scaleX(-1)}}</style><polygon class="s" fill="#a37cff" points="100,20 122,75 180,78 135,115 150,172 100,140 50,172 65,115 20,78 78,75"/></svg>`],
  ['8', 'svg 필터 스티커 테두리 + 길 따라 움직이기', '하얀 테두리 두른 초록 동그라미가 · 하트 길을 따라 돌아야 해요',
    `<svg xmlns="${NS}" width="200" height="200" viewBox="0 0 200 200"><defs><filter id="w"><feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/><feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path id="p" d="M100 165C30 115 30 55 70 50c15-2 25 8 30 20 5-12 15-22 30-20 40 5 40 65-30 115z" fill="none" stroke="#f1c4d2" stroke-width="3" stroke-dasharray="6 6"/><circle r="14" fill="#5cc98a" filter="url(#w)"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle></svg>`],
];
const g = document.getElementById('g');
// 🔥 새 방식 (11-19) : css 상자는 그림으로 굽고 (9번처럼) → 그 그림을 svg 안에 넣고 → 움직임 · 필터는 svg 쪽에서
const bake = (svg, k = 1) => new Promise(ok => { const im = new Image(); im.onload = () => setTimeout(() => { const c = document.createElement('canvas'); c.width = c.height = 200 * k; c.getContext('2d').drawImage(im, 0, 0, 200 * k, 200 * k); try { ok(c.toDataURL('image/png')); } catch (e) { ok(null); } }, 150); im.onerror = () => ok(null); im.src = url(svg); });
const big = (s, how) => s.replace('width="200" height="200" viewBox="0 0 200 200"', 'width="400" height="400" viewBox="0 0 400 400"').replace('<foreignObject x="0" y="0" width="200" height="200">', '<foreignObject x="0" y="0" width="400" height="400">')
  .replace('style="position:relative;width:200px;height:200px;margin:0;padding:0;"', how === 'zoom' ? 'style="position:relative;width:200px;height:200px;margin:0;padding:0;zoom:2;"' : 'style="position:relative;width:200px;height:200px;margin:0;padding:0;transform:scale(2);transform-origin:0 0;"');   // 사파리는 viewBox 로 안 키워서 상자 자체를 2배로
const wrap = (png, css = '', defs = '', attr = '') => `<svg xmlns="${NS}" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">${defs}<style>.m{transform-box:fill-box;transform-origin:center;${css}}</style><image class="m" ${attr} x="0" y="0" width="200" height="200" href="${png}" xlink:href="${png}"/></svg>`;
const card = (n, t, d, s) => { const c = document.createElement('div'); c.className = 'card'; c.innerHTML = `<b>${n}. ${t}</b><small>${d}</small><div class="stage"><img alt=""></div>`; c.querySelector('img').src = s ? url(s) : ''; if (!s) c.querySelector('small').textContent += ' → 굽기 실패 ❌'; g.appendChild(c); };
(async () => {
  const S = Object.fromEntries(T.map(t => [t[0], t[3]]));
  const st = S['3'].replace(/animation:[^;}]+/g, 'animation:none');
  const p2 = await bake(S['2']), p3 = await bake(st), p4 = await bake(S['4']), p5 = await bake(S['5']), p6 = await bake(S['6']), p2x = await bake(big(S['2'], 'scale'), 2), p2z = await bake(big(S['2'], 'zoom'), 2);
  T.filter(t => ['1', '7', '8'].includes(t[0])).forEach(([n, t, d, sv]) => card(n, t + ' (아까 ✅)', d, sv));
  card('2', 'css 상자 (가만히)', '둥근 네모 · 분홍→하늘 그라데이션 · 그림자 · "말랑" · 안 잘려야 해요', p2 && wrap(p2));
  card('3', 'css 상자 + 움직임', '노란 별이 빙글빙글 돌고 · 별 모양이 안 깨져야 해요', p3 && wrap(p3, 'animation:r 3s linear infinite}@keyframes r{to{transform:rotate(360deg)}'));
  card('4', 'css 장식 1 · 2 + 움직임', '동그라미 3개 다 보이고 · 전체가 두근두근 커졌다 작아져야 해요', p4 && wrap(p4, 'animation:b 1s ease-in-out infinite}@keyframes b{50%{transform:scale(1.15)}'));
  card('5', '어려운 css 모음 + 깜빡', '무지개 원 · 가운데 구멍 · 파란 네모 · 안 잘리고 · 천천히 깜빡여야 해요', p5 && wrap(p5, 'animation:f 1.6s ease-in-out infinite}@keyframes f{50%{opacity:.25}'));
  card('6', 'css 상자 + svg 물결 필터', '분홍 네모 가장자리가 울퉁불퉁 (가만히) · 안 잘려야 해요', p2 && wrap(p6 || p2, '', `<defs><filter id="wv" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter></defs>`, 'filter="url(#wv)"'));
  card('10', '2배 굽기 ㄱ (transform 2배)', '2번과 같은 크기 · 더 선명해야 해요 · 작거나 잘리면 ❌', p2x && wrap(p2x));
  card('11', '2배 굽기 ㄴ (zoom 2배)', '2번과 같은 크기 · 더 선명해야 해요 · 작거나 잘리면 ❌', p2z && wrap(p2z));
})();
document.getElementById('ua').textContent = '기기 : ' + navigator.userAgent + (matchMedia('(display-mode: standalone)').matches ? ' · 홈 화면 앱' : '');
</script>
</body>
</html>
